# Pilot: a cross-family team (DeepSeek + Gemma) on split_room. Set the cell per run:
#   uv run undercooked run configs/pilot_cross_family.yaml --rules full|minimal --comms full|none
# Order rate from the bot tuning (configs/all_levels_nocomms.yaml). Every option not set here is
# the default (configs/template.yaml): practice on, 3 rounds of 180 s.
name: pilot_cross_family
level: split_room
orders: {every_s: 20}
epochs: 2
agents:
  - {model: openrouter/deepseek/deepseek-v4.1-flash, provider: baidu/fp8}
  - {model: openrouter/google/gemma-4-31b-it, provider: deepinfra/fp8}
