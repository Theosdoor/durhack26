<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <style>
      .h{font-size:24px;font-weight:bold;fill:#1a1a1a}
      .s{font-size:18px;fill:#444444}
      .k{font-size:15px;font-weight:bold;fill:#666666;letter-spacing:1px}
      .l{stroke:#444444;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="330" fill="#ffffff"/>

  <text x="20" y="28" class="k">ONE SEASON  ·  2–4 LLM AGENTS  ·  NO ASSIGNED ROLES</text>

  <rect x="20" y="45" width="170" height="90" rx="10" fill="#e8f1fb" stroke="#2f6aa8" stroke-width="2"/>
  <text x="105" y="84" class="h" text-anchor="middle">Practice</text>
  <text x="105" y="112" class="s" text-anchor="middle">alone</text>
  <line x1="190" y1="90" x2="228" y2="90" class="l" marker-end="url(#a)"/>

  <rect x="232" y="36" width="720" height="108" rx="12" fill="none" stroke="#999999" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="940" y="30" class="h" text-anchor="end" fill="#555555">× 3 rounds</text>

  <rect x="250" y="45" width="190" height="90" rx="10" fill="#e8f1fb" stroke="#2f6aa8" stroke-width="2"/>
  <text x="345" y="84" class="h" text-anchor="middle">Chat</text>
  <text x="345" y="112" class="s" text-anchor="middle">plan on shared board</text>
  <line x1="440" y1="90" x2="478" y2="90" class="l" marker-end="url(#a)"/>

  <rect x="482" y="45" width="210" height="90" rx="10" fill="#fdf0dc" stroke="#b8741a" stroke-width="2.5"/>
  <text x="587" y="84" class="h" text-anchor="middle">Play round</text>
  <text x="587" y="112" class="s" text-anchor="middle">cook &amp; serve soup</text>
  <line x1="692" y1="90" x2="730" y2="90" class="l" marker-end="url(#a)"/>

  <rect x="734" y="45" width="200" height="90" rx="10" fill="#eef7ec" stroke="#3d8a3a" stroke-width="2"/>
  <text x="834" y="84" class="h" text-anchor="middle">Private turn</text>
  <text x="834" y="112" class="s" text-anchor="middle">see score, take notes</text>
  <line x1="952" y1="90" x2="990" y2="90" class="l" marker-end="url(#a)"/>

  <rect x="994" y="45" width="186" height="90" rx="10" fill="#f4ecf8" stroke="#7a4a9a" stroke-width="2"/>
  <text x="1087" y="84" class="h" text-anchor="middle">Reflection</text>
  <text x="1087" y="112" class="s" text-anchor="middle">role, predicted score</text>

  <!-- zoom into round -->
  <path d="M482,135 L250,190 M692,135 L950,190" stroke="#b8741a" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="250" y="190" width="700" height="125" rx="12" fill="#fffaf2" stroke="#b8741a" stroke-width="1.5"/>
  <text x="600" y="214" class="k" text-anchor="middle">EACH DECISION IN A ROUND</text>

  <rect x="270" y="228" width="140" height="62" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="340" y="266" class="h" text-anchor="middle">State</text>
  <line x1="410" y1="259" x2="446" y2="259" class="l" marker-end="url(#a)"/>
  <rect x="450" y="228" width="120" height="62" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="510" y="266" class="h" text-anchor="middle">LLM</text>
  <line x1="570" y1="259" x2="606" y2="259" class="l" marker-end="url(#a)"/>
  <rect x="610" y="228" width="150" height="62" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="685" y="255" class="h" text-anchor="middle">act / post</text>
  <text x="685" y="279" class="s" text-anchor="middle">tool calls</text>
  <line x1="760" y1="259" x2="796" y2="259" class="l" marker-end="url(#a)"/>
  <rect x="800" y="228" width="130" height="62" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="865" y="255" class="h" text-anchor="middle">Engine</text>
  <text x="865" y="279" class="s" text-anchor="middle">1 tick = 1 s</text>
  <path d="M865,290 L865,305 L340,305 L340,292" class="l" marker-end="url(#a)"/>
</svg>
