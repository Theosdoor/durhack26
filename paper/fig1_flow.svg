<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="590" viewBox="0 0 1200 590" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#4a4a4a;stroke-width:1.5}
      .cli{fill:#f3f0ea;stroke:#4a4a4a;stroke-width:1.5}
      .phase{fill:#e8f1fb;stroke:#2f6aa8;stroke-width:1.5}
      .round{fill:#fdf0dc;stroke:#b8741a;stroke-width:1.5}
      .priv{fill:#eef7ec;stroke:#3d8a3a;stroke-width:1.5}
      .refl{fill:#f4ecf8;stroke:#7a4a9a;stroke-width:1.5}
      .out{fill:#f5f5f5;stroke:#4a4a4a;stroke-width:1.5}
      .t{font-size:14px;fill:#1a1a1a}
      .tb{font-size:15px;font-weight:bold;fill:#1a1a1a}
      .ts{font-size:12px;fill:#333333}
      .mono{font-family:Menlo, Consolas, monospace;font-size:12px;fill:#1a1a1a}
      .lbl{font-size:13px;font-weight:bold;fill:#555555;letter-spacing:0.5px}
      .ln{stroke:#4a4a4a;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="590" fill="#ffffff"/>

  <!-- ===== A: CLI and Inspect ===== -->
  <text x="20" y="28" class="lbl">A  RUN (CLI → INSPECT AI)</text>
  <rect x="20" y="40" width="1160" height="58" rx="6" class="cli"/>
  <text x="34" y="64" class="mono">$ uv run undercooked run configs/overnight_grid.yaml --rules bare \</text>
  <text x="34" y="84" class="mono">      --model openrouter/qwen/qwen3.8-27b --provider primeintellect/fp8      # or --agents "m1@p1,m2@p2" (mixed team)</text>

  <rect x="20" y="118" width="350" height="92" rx="6" class="box"/>
  <text x="34" y="140" class="tb">Config (YAML + CLI overrides)</text>
  <text x="34" y="160" class="ts">levels · n_agents · rules: full | bare | open</text>
  <text x="34" y="177" class="ts">models + pinned OpenRouter endpoints</text>
  <text x="34" y="194" class="ts">rounds 3 × 180 s · practice 120 s · epochs</text>

  <rect x="425" y="118" width="350" height="92" rx="6" class="box"/>
  <text x="439" y="140" class="tb">Inspect AI task</text>
  <text x="439" y="160" class="ts">one sample per level × epoch = one season</text>
  <text x="439" y="177" class="ts">seeded names, seats rotated per epoch</text>
  <text x="439" y="194" class="ts">seasons run in parallel</text>

  <rect x="830" y="118" width="350" height="92" rx="6" class="out"/>
  <text x="844" y="140" class="tb">Outputs</text>
  <text x="844" y="160" class="ts">.eval log: every model call + replay records</text>
  <text x="844" y="177" class="ts">scores: total, per round, per-agent metrics</text>
  <text x="844" y="194" class="ts">→ replay viewer · dashboard · metrics · LLM judges</text>

  <line x1="370" y1="164" x2="423" y2="164" class="ln" marker-end="url(#arr)"/>
  <line x1="775" y1="164" x2="828" y2="164" class="ln" marker-end="url(#arr)"/>
  <line x1="195" y1="98" x2="195" y2="116" class="ln" marker-end="url(#arr)"/>

  <!-- ===== B: one season ===== -->
  <text x="20" y="246" class="lbl">B  ONE SEASON (2–4 AGENTS, NO ASSIGNED ROLES)</text>

  <rect x="20" y="260" width="150" height="84" rx="6" class="phase"/>
  <text x="34" y="283" class="tb">Practice</text>
  <text x="34" y="303" class="ts">alone, small kitchen</text>
  <text x="34" y="320" class="ts">120 s, score ignored</text>
  <text x="34" y="337" class="ts">finish_practice()</text>

  <line x1="170" y1="302" x2="203" y2="302" class="ln" marker-end="url(#arr)"/>

  <!-- repeated block -->
  <rect x="205" y="252" width="700" height="100" rx="8" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="815" y="270" class="tb" fill="#555555">× 3 rounds</text>

  <rect x="220" y="262" width="190" height="82" rx="6" class="phase"/>
  <text x="234" y="285" class="tb">Planning chat</text>
  <text x="234" y="305" class="ts">turns on a shared board</text>
  <text x="234" y="322" class="ts">post(msg) · ready()</text>
  <text x="234" y="339" class="ts">≤ 6 posts each</text>

  <line x1="410" y1="302" x2="433" y2="302" class="ln" marker-end="url(#arr)"/>

  <rect x="435" y="262" width="230" height="82" rx="6" class="round"/>
  <text x="449" y="285" class="tb">Round (180 game s)</text>
  <text x="449" y="305" class="ts">act(plan) · post · read_board · note</text>
  <text x="449" y="322" class="ts">clock stops while models think;</text>
  <text x="449" y="339" class="ts">each decision costs 2 s (+ words)</text>

  <line x1="665" y1="302" x2="688" y2="302" class="ln" marker-end="url(#arr)"/>

  <rect x="690" y="276" width="200" height="68" rx="6" class="priv"/>
  <text x="704" y="299" class="tb">Private turn</text>
  <text x="704" y="319" class="ts">sees round score</text>
  <text x="704" y="336" class="ts">note(text) or pass</text>

  <line x1="905" y1="302" x2="938" y2="302" class="ln" marker-end="url(#arr)"/>

  <rect x="940" y="260" width="240" height="84" rx="6" class="refl"/>
  <text x="954" y="283" class="tb">Final reflection</text>
  <text x="954" y="303" class="ts">strategy · role · score · teammates</text>
  <text x="954" y="320" class="ts">predicted score with full rules</text>
  <text x="954" y="337" class="ts">(PREDICTED_SCORE: n)</text>

  <!-- ===== C: decision loop in a round ===== -->
  <text x="20" y="392" class="lbl">C  ONE DECISION INSIDE A ROUND</text>

  <rect x="20" y="406" width="300" height="140" rx="6" class="box"/>
  <text x="34" y="428" class="tb">State text (each decision)</text>
  <text x="34" y="452" class="mono">Time 42/180 s · Score 20</text>
  <text x="34" y="470" class="mono">  01234</text>
  <text x="34" y="486" class="mono">0 XXPXX</text>
  <text x="34" y="502" class="mono">1 O  FO</text>
  <text x="34" y="518" class="mono">2 XK  X     pot_1: 2 onions</text>
  <text x="34" y="534" class="mono">3 XDXSX     Board: 1 unread</text>

  <line x1="320" y1="476" x2="373" y2="476" class="ln" marker-end="url(#arr)"/>

  <rect x="375" y="426" width="220" height="100" rx="6" class="round"/>
  <text x="389" y="450" class="tb">LLM agent</text>
  <text x="389" y="470" class="ts">one continuous conversation</text>
  <text x="389" y="487" class="ts">per season; thinks briefly</text>
  <text x="389" y="504" class="ts">(max 2000 tokens, then a</text>
  <text x="389" y="521" class="ts">forced answer)</text>

  <line x1="595" y1="476" x2="648" y2="476" class="ln" marker-end="url(#arr)"/>

  <rect x="650" y="416" width="250" height="120" rx="6" class="box"/>
  <text x="664" y="438" class="tb">Tool calls</text>
  <text x="664" y="460" class="mono">act(["interact(onion_crate)",</text>
  <text x="664" y="476" class="mono">     "interact(pot_1)"])</text>
  <text x="664" y="496" class="mono">post("I'll fill pot_1")</text>
  <text x="664" y="514" class="ts">plan = up to 5 high-level actions,</text>
  <text x="664" y="530" class="ts">auto-pathing to objects</text>

  <line x1="900" y1="476" x2="953" y2="476" class="ln" marker-end="url(#arr)"/>

  <rect x="955" y="416" width="225" height="120" rx="6" class="box"/>
  <text x="969" y="438" class="tb">Engine (1 tick = 1 s)</text>
  <text x="969" y="460" class="ts">interactions, then movement,</text>
  <text x="969" y="477" class="ts">then pots cook (20 s)</text>
  <text x="969" y="494" class="ts">3 onions → soup → dish → hatch</text>
  <text x="969" y="511" class="ts">+20 per soup served</text>
  <text x="969" y="528" class="ts">seeded tie-breaks, no priority</text>

  <path d="M1067,536 L1067,568 L170,568 L170,548" class="ln" marker-end="url(#arr)"/>
  <text x="520" y="584" class="ts" fill="#555555">plan done or failed → next decision (new state text)</text>
</svg>
