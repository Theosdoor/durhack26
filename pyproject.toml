[project]
name = "durhack26"
version = "0.1.0"
description = "Undercooked: LLM agents cooperating in a kitchen game, logged with Inspect AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.288",
    "matplotlib>=3.11.2",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
# Gemini API models (google/<model>): `uv sync --extra gemini`, GOOGLE_API_KEY in .env
gemini = [
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
undercooked = "undercooked.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undercooked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
